name: 데이터 갱신

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      weekly:
        description: "기사 매칭 · 제도 일정도 다시 검색"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비
        run: python prepare.py
      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          REB_KEY: ${{ secrets.REB_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWNER: ${{ vars.OWNER }}
        run: |
          cd scripts
          python collect_permits.py || echo "permits 실패"
          python collect_market.py  || echo "market 실패"
          python collect_deals.py   || echo "deals 실패"
          python collect_news.py ${{ inputs.weekly && '--weekly' || '' }} || echo "news 실패"
          python build.py
      - name: 커밋
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d') 자동 갱신"
          git push
